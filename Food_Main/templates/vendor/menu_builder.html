{% extends 'include/base.html' %}

{% load static %}

{% block content %}

<!-- Main Section Start -->
		<div class="main-section">
			<!--  include cover page  -->
              {% include "include/cover.html" %}
			<div class="page-section account-header buyer-logged-in">
				<div class="container">
					<div class="row">
						<div class="col-lg-3 col-md-3 col-sm-12 col-xs-12">
							<!--  Load left side bar  -->
							  {% include "include/vend_leftsidebar.html" %}
						</div>
						<div class="col-lg-9 col-md-9 col-sm-12 col-xs-12">
							<div class="user-dashboard loader-holder">
								<div class="user-holder">
									<h5> Build your Food Menu</h5>
									<hr>
                                    <h6> Menu Category </h6>
                                    <a href="" class="btn btn-success float-right m-1"><i class="fa fa-plus"></i> Add Food </a>
                                    <a href="" class="btn btn-info float-right m-1"><i class="fa fa-plus"></i> Add Category </a>

                                    <table class="table table-hover table-borderless">
                                        <tbody class="text text-center">
                                            {% for cat in categories %}
                                            <tr>
                                                <th scope="row">{{forloop.counter}}</th>
                                                <td>
                                                    <a href="{% url 'fooditem_by_category' cat.id %}">
                                                        <p class="mb-0 font-weight-bold"> {{cat}} </p>
                                                    </a>
                                                </td>
                                                <td><i class="fa fa-pencil text-success"></i> &nbsp;&nbsp; <i class="fa fa-trash text-danger"></i></td>
                                            </tr>
                                            {% endfor %}
                                        </tbody>
                                    </table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Main Section End -->

{% endblock %}
